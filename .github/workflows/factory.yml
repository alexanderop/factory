name: factory

on:
  workflow_dispatch:
    inputs:
      prd:
        description: PRD path (e.g. plans/observability-improvements.md)
        required: true
        type: string

concurrency:
  group: factory-${{ github.event.inputs.prd }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OTEL_SDK_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: ensure local main ref
        run: git checkout -B main

      - name: configure git identity
        run: |
          git config --global user.email "factory-bot@users.noreply.github.com"
          git config --global user.name  "factory-bot"

      - uses: ./.github/actions/setup

      - name: install claude
        run: |
          CLAUDE_CODE_VERSION="2.1.138"
          for attempt in 1 2 3; do
            timeout --foreground --kill-after=10 120 bash -c \
              "curl -fsSL https://claude.ai/install.sh | bash -s -- $CLAUDE_CODE_VERSION" && break
            [ $attempt -eq 3 ] && exit 1
            sleep 5
          done

      - name: tail events into job log
        run: |
          mkdir -p .factory/runs
          ( while [ ! -e .factory/runs/latest ]; do sleep 1; done
            tail -f .factory/runs/latest/events.jsonl | jq -c . ) &

      - name: run factory
        run: pnpm dogfood "${{ github.event.inputs.prd }}"

      - if: always()
        name: render step summary
        run: |
          [ -f .factory/runs/latest/events.jsonl ] || exit 0
          echo "## factory run — \`${{ github.event.inputs.prd }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          jq -r 'select(.type=="step.end") | "- **\(.step)** — \(.status) (\(.durationMs // 0)ms)"' \
            .factory/runs/latest/events.jsonl >> $GITHUB_STEP_SUMMARY
